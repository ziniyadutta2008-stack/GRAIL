[project]
name = "grail"
version = "0.1.0"
description = "GRAIL backend: governance domain services, Lambda adapters and agent contracts."
authors = [
    { name = "Ziniya Dutta", email = "ziniyadutta2008@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.114",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "sqlalchemy>=2.1.6",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jsonschema>=4.26.0",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "types-boto3[ssm]>=1.43.114",
    "types-jsonschema>=4.26.0.20261006",
]
migrations = [
    "alembic>=1.20.0",
]

[tool.uv]
default-groups = ["dev", "migrations"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests", "migrations", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "C4", "RUF", "PTH"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
branch = true
source = ["grail"]

[tool.coverage.report]
show_missing = true
skip_covered = true
